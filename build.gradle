plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.instinctai.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.instinctai.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.3.0'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
